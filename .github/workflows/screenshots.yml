name: Screenshot promosi (mode demo)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Kosongin disk (emulator butuh ~7 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - name: Nyalain KVM (emulator cepat)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapin project Android
        run: |
          flutter create --org com.nadia --project-name nova --platforms android .
          dart tool/patch_android.dart
          # Khusus emulator CI (GPU software): render pakai OpenGL, bukan Impeller/Vulkan.
          sed -i 's#<application#<application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
          grep -n "EnableImpeller" android/app/src/main/AndroidManifest.xml
          flutter pub get

      # Build dulu sebelum emulator nyala, lalu matiin Gradle biar RAM runner cukup.
      - name: Build APK test (mode demo)
        run: |
          flutter build apk --debug --target=integration_test/screenshots_test.dart --dart-define=DEMO=true
          (cd android && ./gradlew --stop) || true
          free -h

      - name: Ambil screenshot di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: false
          emulator-options: -no-metrics -no-window -gpu swiftshader_indirect -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshots_test.dart --use-application-binary=build/app/outputs/flutter-apk/app-debug.apk

      - name: Rilis screenshot
        uses: softprops/action-gh-release@v2
        with:
          tag_name: screenshots-${{ github.run_number }}
          name: Screenshot promosi ${{ github.run_number }}
          body: Screenshot mode demo (lagu & artis fiktif) dari commit ${{ github.sha }}.
          prerelease: true
          files: screenshots/*.png
