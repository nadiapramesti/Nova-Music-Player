# Pasang halaman pemutar Nova buat TV (Google Cast Web Receiver) di GitHub Pages.
# Alamatnya: https://nadiapramesti.github.io/Nova-Music-Player/
# Sekali aja: repo Settings > Pages > Source: "GitHub Actions".
name: Pemutar TV (Pages)

# Belum aktif (butuh daftar Google Cast Developer, US$5). Jalanin manual dari tab
# Actions setelah Pages dinyalain.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: receiver
      - id: deploy
        uses: actions/deploy-pages@v4
