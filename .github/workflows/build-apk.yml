name: Build APK

# Tiap push ke main dicek (analyze + test + build).
# Rilis baru cuma dibuat kalau `version:` di pubspec.yaml naik (contoh 1.0.0 → 1.0.1):
# hasilnya rilis "Nova v1.0.1" berisi Nova-1.0.1.apk.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapin project Android
        run: |
          flutter create --org com.nadia --project-name nova --platforms android .
          dart tool/patch_android.dart
          flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Cek versi
        id: ver
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION udah dirilis, cuma dicek."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Versi baru v$VERSION, bakal dirilis."
          fi

      - name: Build APK
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "Nova-${{ steps.ver.outputs.version }}.apk"

      - name: Rilis APK
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Nova v${{ steps.ver.outputs.version }}
          body: |
            Download **Nova-*.apk** di bawah, lalu buka file-nya di HP buat install.

            Offline, tanpa iklan, tanpa akun.
          files: Nova-*.apk
          make_latest: true
