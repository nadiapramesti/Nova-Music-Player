name: Build APK

# Tiap push ke main dicek (analyze + test + build).
# Rilis baru cuma dibuat kalau `version:` di pubspec.yaml naik (contoh 1.0.0 → 1.0.1):
# hasilnya rilis "Nova v1.0.1" berisi Nova-1.0.1.apk.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapin project Android
        run: |
          flutter create --org com.nadia --project-name nova --platforms android .
          dart tool/patch_android.dart
          flutter pub get

      # Kunci tanda tangan permanen (biar update bisa dipasang di atas versi lama).
      # File kuncinya disimpan terenkripsi di repo; passwordnya di secret NOVA_KEY_PASSWORD.
      - name: Kunci tanda tangan
        id: sign
        env:
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          if [ -z "$NOVA_KEY_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret NOVA_KEY_PASSWORD belum diisi: APK pakai kunci debug & gak dirilis."
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in tool/signing/nova-release.jks.enc \
            -out android/app/nova-release.jks -pass env:NOVA_KEY_PASSWORD
          printf 'storeFile=nova-release.jks\nstorePassword=%s\nkeyAlias=nova\nkeyPassword=%s\n' \
            "$NOVA_KEY_PASSWORD" "$NOVA_KEY_PASSWORD" > android/key.properties
          dart tool/patch_android.dart --sign
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Cek versi
        id: ver
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.sign.outputs.ready }}" != "true" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Kunci tanda tangan belum siap, gak dirilis."
          elif git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION udah dirilis, cuma dicek."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Versi baru v$VERSION, bakal dirilis."
          fi

      - name: Build APK
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "Nova-${{ steps.ver.outputs.version }}.apk"
          # Bukti tanda tangan di log (sidik jari SHA-256 harus sama tiap rilis).
          SIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$SIGNER" verify --print-certs "Nova-${{ steps.ver.outputs.version }}.apk" | grep -m1 "SHA-256" || true

      - name: Rilis APK
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Nova v${{ steps.ver.outputs.version }}
          body: |
            Download **Nova-*.apk** di bawah, lalu buka file-nya di HP buat install.

            Offline, tanpa iklan, tanpa akun.
          files: Nova-*.apk
          make_latest: true

      # Rilis lama zaman "build-N" (sebelum ada nomor versi) dibuang biar halaman rilis rapi.
      - name: Hapus rilis build lama
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" -L 200 --json tagName -q '.[].tagName' \
            | grep '^build-' \
            | while read -r t; do gh release delete "$t" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag; done || true
