name: Build APK

# Push ke main: cuma dicek (analyze + test + build), gak bikin rilis.
# Tag v* (contoh v1.0.0): bikin rilis "Nova v1.0.0" berisi APK-nya.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapin project Android
        run: |
          flutter create --org com.nadia --project-name nova --platforms android .
          dart tool/patch_android.dart
          flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            flutter build apk --release --build-name="$VERSION" --build-number=${{ github.run_number }}
            cp build/app/outputs/flutter-apk/app-release.apk "Nova-$VERSION.apk"
          else
            flutter build apk --release
          fi

      - name: Rilis APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Nova ${{ github.ref_name }}
          body: |
            Download **Nova-*.apk** di bawah, lalu buka file-nya di HP buat install.

            Offline, tanpa iklan, tanpa akun.
          files: Nova-*.apk
          make_latest: true
