name: nova
description: Nova — pemutar musik lokal. Offline, tanpa iklan, tanpa akun.
publish_to: 'none'
version: 1.6.3+16

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.40
  audio_session: ^0.1.21
  # ---- Versi laptop (Windows) ----
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: any
  window_manager: ^0.5.1
  audio_metadata_reader: ^1.8.1
  # Cuma implementasi Windows (versi Android-nya bikin lint build APK crash).
  file_selector_platform_interface: ^2.6.2
  file_selector_windows: ^0.9.3
  path_provider: ^2.1.4
  multicast_dns: ^0.3.2
  smtc_windows: ^1.1.0
  just_audio_background: ^0.0.1-beta.13
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans.ttf
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
